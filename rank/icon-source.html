<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  /* 앱 아이콘 원본(600x600). 결과 카드와 같은 파란 그러데이션 + "상위 ?%" + 줄 세우기 점. */
  @font-face { font-family: 'Pretendard'; font-weight: 800; src: url('file:///home/deploy/.claude/skills/tistory-benefit/renderer/fonts/Pretendard-ExtraBold.woff2') format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 600px; height: 600px; overflow: hidden; }
  .icon {
    position: relative;
    width: 600px;
    height: 600px;
    background: linear-gradient(155deg, #0A2F8F 0%, #2B6FE8 62%, #3F8CFF 100%);
    font-family: 'Pretendard', sans-serif;
    font-weight: 800;
    color: #FFFFFF;
    overflow: hidden;
  }
  .glow {
    position: absolute; top: -170px; right: -170px; width: 520px; height: 520px;
    background: radial-gradient(circle, rgba(191, 220, 255, 0.55) 0%, transparent 68%);
  }
  .top { position: absolute; left: 76px; top: 82px; font-size: 104px; letter-spacing: -4px; line-height: 1; }
  .big { position: absolute; left: 68px; top: 176px; font-size: 290px; letter-spacing: -14px; line-height: 1; white-space: nowrap; }
  .big .q { color: #F7CE68; }
  .dots { position: absolute; left: 80px; right: 80px; bottom: 74px; display: flex; justify-content: space-between; align-items: center; }
  .dot { width: 40px; height: 40px; border-radius: 50%; background: #BFDCFF; }
  .dot.ahead { background: rgba(255, 255, 255, 0.24); }
  .dot.me { background: #FFFFFF; box-shadow: 0 0 0 10px rgba(255, 255, 255, 0.3); }
</style>
</head>
<body>
  <div class="icon">
    <div class="glow"></div>
    <div class="top">상위</div>
    <div class="big"><span class="q">?</span>%</div>
    <div class="dots">
      <span class="dot ahead"></span><span class="dot ahead"></span><span class="dot me"></span>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
  </div>
</body>
</html>
